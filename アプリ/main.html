<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <link href="./main.css" rel="stylesheet">
       <title>メモアプリ</title>
    </head>
    <body>
        <h1 id="h1">メモアプリ</h1>
        <div id="memoTitles">
            <ul>
                <li><a href="./memo1.html" id="title1"><!-- メモのタイトルが表示される --></a></li>
                <li><a href="./memo2.html" id="title2"><!-- 〃 --></a></li>
                <li><a href="./memo3.html" id="title3"><!-- 〃 --></a></li>
                <li><a href="./memo4.html" id="title4"><!-- 〃 --></a></li>
                <li><a href="./memo5.html" id="title5"><!-- 〃 --></a></li>
            </ul>
        </div>
        <script>
            window.onload = function(){
                title_disp();
            }

            function title_disp() {
                memo=5;//メモの総数
                //メモのタイトルのキー値であるmemo?_histの値を取得する。?には異なる数字が入る。
                for(let i = 1; i <= memo; i++){
                    
                    memoTitle = [window.localStorage.getItem("memo"+ i +"_title")];
                    //タイトルが取得できたなら、画面に表示する
                    if (memoTitle){
                    
                        var memo_title_elm = document.getElementById("title" + i);
                        memo_title_elm.innerHTML = memoTitle;
                    
                    }
                }
                // もしタイトルを取得できなかったら、新たにmemo?という値で生成する。?には異なる数字が入る
                if(!memoTitle[0]){
              
                    localStorage.setItem("memo1_title","memo1");
                    localStorage.setItem("memo2_title","memo2");
                    localStorage.setItem("memo3_title","memo3");
                    localStorage.setItem("memo4_title","memo4");
                    localStorage.setItem("memo5_title","memo5");
                    title_disp();//改めて表示機能を実行し、画面に表示させる。
              
                }

            }       
        </script>
    </body>
</html>
